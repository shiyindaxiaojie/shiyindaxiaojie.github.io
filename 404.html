<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const allowedThemes = ["light", "dark", "eye"];
        let initialTheme = "dark";

        try {
          const storedTheme = localStorage.getItem("theme");
          if (allowedThemes.includes(storedTheme)) {
            initialTheme = storedTheme;
          }
        } catch {}

        document.documentElement.setAttribute("data-theme", initialTheme);
        document.documentElement.style.colorScheme = initialTheme === "dark" ? "dark" : "light";
      })();
    </script>
    <style>
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #app {
        background-color: #ffffff;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #app {
        background-color: #101727;
      }

      html[data-theme="eye"],
      html[data-theme="eye"] body,
      html[data-theme="eye"] #app {
        background-color: #ece3d0;
      }
    </style>
